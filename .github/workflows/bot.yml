
name: Maclar2121 Telegram Bot

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: "Sadece veri kaynaklarını test et"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only && '1' || '0' }}
        run: python bot.py

      - name: Telegram offset bilgisini kaydet
        if: success() && env.TEST_MODE != '1'
        env:
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only && '1' || '0' }}
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Telegram offset"
              git push
            fi
          fi
